# Postiz (jx fork) - self-hosted stack.
# Everything configurable lives in ./.env (run ./install.sh to create it, or copy .env.example).
# The values under `environment:` below are derived from .env on purpose (hostnames inside the
# docker network, database/redis URLs built from the passwords); everything else in .env
# (social channel keys, storage, mail, ...) is passed to the container through `env_file`.
services:
  postiz:
    # Built from this repository so the fork's own changes are included.
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: postiz-jx:local
    container_name: postiz
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      # === Required Settings (see .env)
      MAIN_URL: '${MAIN_URL:-http://localhost:4007}'
      FRONTEND_URL: '${FRONTEND_URL:-http://localhost:4007}'
      NEXT_PUBLIC_BACKEND_URL: '${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4007/api}'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is not set - run ./install.sh or copy .env.example to .env}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-postiz-user}:${POSTGRES_PASSWORD:-postiz-password}@postiz-postgres:5432/${POSTGRES_DB:-postiz-db-local}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-postiz-redis-password}@postiz-redis:6379'
      BACKEND_INTERNAL_URL: '${BACKEND_INTERNAL_URL:-http://localhost:3000}'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: '${DISABLE_REGISTRATION:-false}'

      # === Storage Settings (local uploads live in the postiz-uploads volume)
      STORAGE_PROVIDER: '${STORAGE_PROVIDER:-local}'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Social channels, Cloudflare R2, OAuth login, Stripe, short links, Sentry ...
      # All of these come from .env through `env_file` above - see .env.example for the full list.
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '${POSTIZ_PORT:-4007}:5000'
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-postiz-password}'
      POSTGRES_USER: '${POSTGRES_USER:-postiz-user}'
      POSTGRES_DB: '${POSTGRES_DB:-postiz-db-local}'
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-postiz-user} -d ${POSTGRES_DB:-postiz-db-local}
      interval: 10s
      timeout: 3s
      retries: 3
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-postiz-redis-password}
    environment:
      REDISCLI_AUTH: '${REDIS_PASSWORD:-postiz-redis-password}'
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # For Application Monitoring / Debugging - not started by default.
  # Start it with: docker compose --profile debug up -d
  spotlight:
    profiles: ["debug"]
    pull_policy: always
    container_name: spotlight
    ports:
      - 8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:latest
    networks:
      - postiz-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  temporal:
    container_name: temporal
    ports:
      - '7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '8080:8080'

volumes:
  postgres-volume:
    external: false

  postiz-redis-data:
    external: false

  postiz-config:
    external: false

  postiz-uploads:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
